# Configuration file for ccAutomator
# Format: one argument per line.  Flags stand alone; options are followed by
#         their value on the next line.  Lines starting with # (and text after
#         an inline #) are comments and are ignored.

# ============================================================================
# INPUT / PRIMING
# ============================================================================
# --prime-file: plain-text file of card names to prime (load) in the renderer
#               before capture, so art/fonts settle first.  default: not set.
--prime-file
prime.txt

# ============================================================================
# SERVERS
# ============================================================================
# --url: Card Conjurer web app URL.  Required for 'selenium'/'cc-file' modes.
#        default: not set (must be provided or supplied on the command line).
#--url
#http://mtgproxy:4242/
#
# --image-server: base URL of the web server that stores custom art
#                 (e.g. 'http://mtgproxy:4242').  default: not set (local mode).
#--image-server
#http://mtgproxy:4242
# --upload-path: if set, the final PNG is ALSO uploaded to this path on
#                --image-server (e.g. '/local_art/card_images/ccAutomator/').
#                default: not set (no upload).
#--upload-path
#/local_art/card_images/ccAutomator/
#
# --output-dir: directory to save card images locally.  default: current dir.
# --save-cc-file: also save the Card Conjurer project file (.cardconjurer)
#                 containing all processed cards.  default: off.
#--output-dir
#decks/

# ============================================================================
# ART / UPSAMPLING
# ============================================================================
# --autofit-art: check 'Autofit when setting art' in the renderer before
#                applying custom art.  default: off.
--autofit-art
# --upscale-art: enable Ilaria upscaling for custom art.  default: off.
# --ilaria-url: URL of the Ilaria upscaling service.  default: not set.
# --upscaler-model: Ilaria model name.  default: 'RealESRGAN_x2plus'.
# --upscaler-factor: upscale multiplier.  default: 4.
#--upscale-art
#--ilaria-url
#http://172.17.1.217:7860
#--upscaler-model
#RealESRGAN_x2plus
#--upscaler-factor
#4
# --card-builder: 'selenium' (driver-driven; default) or 'json' (build files
#                 directly, no browser).  default: 'selenium'.
#--card-builder
#selenium
# --render-delay: seconds to wait after selecting a print before capturing.
#                 default: 1.5.
#--render-delay
#1.5

# ============================================================================
# FRAME / BORDER
# ============================================================================
# --frame: name of the frame to select from the dropdown (e.g. 'Seventh').
#          Required for 'selenium' and 'cc-file' modes.  default: not set.
--frame
Seventh
# --white-border: apply the white border to the card frame.  default: off.
--white-border
# --black-border: remove a white border (if present) to revert to black.  default: off.
#--black-border

# ============================================================================
# TITLE BAR
# (When --auto-fit-title is set, the tags below become the *starting* values
#  that auto-fit walks DOWNWARD from if the name + cost don't fit the bar.
#  The width is estimated from the name using the calibrated per-glyph table.)
# ============================================================================
# --title-up: add a {up#} tag to the Title (nudge text up by # px).  default: not set.
--title-up
9
# --title-font-size: add a {fontsize#} tag (relative size offset) to the Title.  default: not set.
--title-font-size
4
# --title-left: add a {left#} tag to the Title (shift left by # px, freeing room).  default: not set.
--title-left
40
# --title-kerning: add a {kerning#} tag (letter-spacing px) to the Title.  default: not set.
--title-kerning
4
# --title-shadow: add a {shadow#} tag to the Title.  default: not set.
--title-shadow
5
# --auto-fit-title: shrink Title kerning/font size so the name fits the name
#                   bar beside the mana cost.  default: off.
# (Comment this out to keep the raw kerning/font-size values unconditionally.)
--auto-fit-title

# ============================================================================
# TYPE LINE
# (When --auto-fit-type is set, the tags below become the *starting* values
#  that auto-fit walks DOWNWARD from if the type line + set symbol don't fit
#  the row.  The width is estimated from the type text using the calibrated
#  per-glyph table, and the right boundary is this card's actual set-symbol
#  edge (or the ~905px field end when there is no symbol).)
# ============================================================================
# --auto-fit-type: shrink Type kerning/font size so the type line fits the
#                  row alongside the set symbol on the right.  default: off.
# (Comment this out to keep the raw kerning/font-size values unconditionally.)
--auto-fit-type
# --type-left: add a {left#} tag to the Type (shift left by # px).  default: not set.
--type-left
40
# --type-kerning: add a {kerning#} tag (letter-spacing px) to the Type.  default: not set.
--type-kerning
3
# --type-font-size: add a {fontsize#} tag to the Type.  default: not set.
# --type-shadow: add a {shadow#} tag to the Type.  default: not set.
#--type-font-size
#0
#--type-shadow
#0
# --type-gap: the required clearance (px) between the END of the type line and
#             the set symbol / row edge that auto-fit treats as the width
#             target.  Higher = larger gap (type shrinks sooner).
#             default: 45.
--type-gap
45
# --min-kerning: floor for BOTH --auto-fit-type and --auto-fit-title.  Kerning
#                is shrunk to this value before the fit starts cutting font
#                size.  default: 0 (no extra floor).
--min-kerning
0

# ============================================================================
# POWER / TOUGHNESS
# ============================================================================
# --pt-kerning: add a {kerning#} tag to the Power/Toughness.  default: not set.
--pt-kerning
7
# --pt-font-size: add a {fontsize#} tag to the Power/Toughness.  default: not set.
--pt-font-size
45
# --pt-shadow: add a {shadow#} tag to the Power/Toughness.  default: not set.
--pt-shadow
6
# --pt-up: add a {up#} tag to the Power/Toughness (nudge up by # px).  default: not set.
# --pt-left: add a {left#} tag to the Power/Toughness.  default: not set.
# --pt-bold: wrap the Power/Toughness text in {bold} tags.  default: off.
#--pt-up
#0
#--pt-left
#0
#--pt-bold

# ============================================================================
# RULES TEXT
# ============================================================================
# --hide-reminder-text: check the 'Hide reminder text' checkbox.  default: off.
--hide-reminder-text
# --rules-bounds-y: adjust the rules text box Y position by # (relative delta).  default: not set.
--rules-bounds-y
13
# --rules-bounds-height: adjust the rules text box height by # (relative delta).  default: not set.
--rules-bounds-height
-26
# --rules-bounds-x: adjust the rules text box X position by # (relative delta).  default: not set.
# --rules-bounds-width: adjust the rules text box width by # (relative delta).  default: not set.
# --rules-down: add a {down#} tag to the Rules text (nudge down by # px).  default: not set.
#--rules-bounds-x
#0
#--rules-bounds-width
#0
#--rules-down
#0
# --flavor-font: if rules text contains {flavor}, insert a {fontsize#} tag
#                immediately after it.  default: not set.
--flavor-font
-15

# ============================================================================
# CARD SELECTION
# ============================================================================
# --card-selection: source of card versions ('scryfall' or 'cardconjurer').
#                   Required for 'selenium' mode.  default: not set.
--card-selection
scryfall
# --set-selection: final capture strategy after filtering ('all','latest',
#                 'earliest','random').  default: 'earliest'.
--set-selection
all
# --no-match-selection: what to do when a Scryfall query finds no match
#                       ('skip','latest','earliest','random' or 'all').
#                       default: 'earliest'.
--no-match-selection
random

# ============================================================================
# SET FILTERING
# ============================================================================
# --include-set / --exclude-set apply to ALL cards and CANNOT be combined with
# the granular filters below.
# Basic:
# --include-set: whitelist of sets to capture (ALL cards).  default: not set.
#--include-set
#4ed,m21
# --exclude-set: blacklist of sets to ignore (ALL cards).  default: not set.
#--exclude-set
#30a,sld,pblb  # Exclude anniversary, secret lair, and bloomburrow
# Granular (per-category):
# --spells-include-set: whitelist of sets for SPELLS (non-basic lands).  default: not set.
#--spells-include-set
#blb,blc
# --spells-exclude-set: blacklist of sets for SPELLS (non-basic lands).  default: not set.
#--spells-exclude-set
#tmt,tla,spm,mar,eoe,j25
# --basic-land-include-set: whitelist of sets for BASIC LANDS.  default: not set.
# --basic-land-exclude-set: blacklist of sets for BASIC LANDS.  default: not set.
#--basic-land-include-set
#--basic-land-exclude-set

# ============================================================================
# MISC
# ============================================================================
# --scryfall-filter: append arbitrary Scryfall query filters to the base query
#                    (e.g. 'lang:en' or 'is:fullart').  default: not set.
# --set-symbol-source: where Card Conjurer fetches set symbols from,
#                      'cardconjurer' (built-in) or 'hexproof' (covers
#                      promos/TRK/ECC etc.).  default: 'cardconjurer'.
#--set-symbol-source
#cardconjurer
#--scryfall-filter
#"-is:ub"
