#
# --auto-fit-pt: widen the Power/Toughness BOX (shifting it left, holding its
#                right edge) just enough that a WIDE P/T (e.g. 12/12) is no
#                longer scale-fitted down to the box, so the large {fontsize}
#                above is honored.  Narrow P/Ts (3/4, 8/8) that already fit
#                are left untouched.  At card time this is PURE MATH against
#                pt_calib.json (a per-glyph width law + the box width-capacity
#                law, calibrated ONCE offline by pt_calibrate.py) -- no
#                per-card render, no re-measurement.  Re-run pt_calibrate.py
#                after any frame/font change to refresh the table.  default: off.
# (Comment this out to let wide P/Ts scale-fit down to the small default box.)
#--auto-fit-pt
#
# --pt-bounds-*: manually adjust the P/T box (relative delta, like
#                --rules-bounds-*).  To WIDEN the box pass a positive
#                --pt-bounds-width AND a negative --pt-bounds-x of the same
#                size (the right edge is at the card edge).  Applied BEFORE
#                --auto-fit-pt, so the auto-fit's base box is your widened one.
#                default: not set.
#--pt-bounds-x
#0
#--pt-bounds-y
#0
#--pt-bounds-width
#0
#--pt-bounds-height
#0
#
# ============================================================================
# RULES TEXT
# ============================================================================
# --hide-reminder-text: check the 'Hide reminder text' checkbox.  default: off.
#--hide-reminder-text
# --inject-reminder-text: normalize reminder text -- every card carrying a
#                         listed keyword ability gets the canonical sentence
#                         from reminder_map.json (printed variants are
#                         replaced, missing ones added; e.g. Serra Angel's
#                         Flying).  Uniform wording, no double reminders.
#                         Abilities + wording are in reminder_map.json (edit
#                         freely).  Note: combining with --hide-reminder-text
#                         strips ALL reminders at render, including canonical.
#                         default: off.
--inject-reminder-text
# --reminder-map: path to the ability -> reminder JSON map (default: reminder_map.json next to ccAutomator.py).
#--reminder-map
#reminder_map.json
#
# --- Rules-text alignment (center / left / right) ----------------------------
# --center-text: auto-center the rules text of cards WotC printed centered, per
#                Scryfall's 'centered text' print tag (classic one-line spells,
#                the basic lands, short-text lands).  The tag list is fetched
#                ONCE from the tagger into an OFFLINE cache (centered_text_cache.json)
#                at startup, then matched by card name -- no network per card, and
#                an offline run still works off the last good cache.  default: off.
--center-text
# --text-layout-map: per-card OVERRIDE map (name -> 'center'/'left'/'right').
#                    An entry ALWAYS wins over --center-text: use it to force a
#                    card LEFT (long text you don't want centered) or CENTER one
#                    the tag doesn't cover.  Edit text_layout_map.json.
#                    default: text_layout_map.json next to ccAutomator.py.
#--text-layout-map
#text_layout_map.json
# --refresh-centered-cache: force re-fetch of the 'centered text' tag cache at
#                           startup (otherwise fetched only when missing/older
#                           than a week).  default: off.
#--refresh-centered-cache
#
# --- Rules-text body size (classic/Unlimited look) ----------------------------
# --rules-font-size: prepend a {fontsize#} tag (relative px) to the rules-text
#                    BODY: it renders at frame-base + # and the renderer scales
#                    it DOWN only if the text overflows the box -- short text
#                    stays large (classic/Unlimited look), long text shrinks to
#                    fit.  The --flavor-font step-down stays relative to it, so
#                    the flavor keeps the same smaller size.  Lands already size
#                    themselves and are unaffected.  default: not set.
#                    Measured on the Seventh frame: +35 ~= Unlimited Edition,
#                    +8 ~= 3rd Edition, +4 ~= 4th Edition, unset ~= 4th or a
#                    hair smaller.
--rules-font-size
35
# --rules-font-map: per-card rules-text body {fontsize} override map (JSON
#                   object of name -> relative px, like text_layout_map.json).
#                   An entry ALWAYS wins over --rules-font-size (and works even
#                   when --rules-font-size is off): use it to force one card
#                   larger or smaller.  Edit rules_font_map.json.
#                   default: rules_font_map.json next to ccAutomator.py.
#--rules-font-map
#rules_font_map.json
# --rules-bounds-y: adjust the rules text box Y position by # (relative delta).  default: not set.
--rules-bounds-y
13
# --rules-bounds-height: adjust the rules text box height by # (relative delta).  default: not set.
--rules-bounds-height
-26
# --rules-bounds-x: adjust the rules text box X position by # (relative delta).  default: not set.
# --rules-bounds-width: adjust the rules text box width by # (relative delta).  default: not set.
# --rules-down: add a {down#} tag to the Rules text (nudge down by # px).  default: not set.
#--rules-bounds-x
#0
#--rules-bounds-width
#0
#--rules-down
#0
# --flavor-font: if rules text contains {flavor}, insert a {fontsize#} tag
